<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Contest | SGIPC Admin</title>
    <link rel="stylesheet" href="create-contest.css">
</head>
<body>
    <div class="admin-container">
        <header class="page-header">
            <a href="admin.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Dashboard
            </a>
            <h1>Create New Contest</h1>
            <p class="subtitle">Set up a new competitive programming round for the platform.</p>
        </header>

        <main class="form-card">
            <form action="process_contest.php" method="POST" class="contest-form">
                
                <div class="form-group full-width">
                    <label for="contest_title">Contest Title</label>
                    <input type="text" id="contest_title" name="contest_title" placeholder="e.g., SGIPC Intra-University Team Selection" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="contest_date">Date</label>
                        <input type="date" id="contest_date" name="contest_date" required>
                    </div>
                    <div class="form-group">
                        <label for="start_time">Start Time</label>
                        <input type="time" id="start_time" name="start_time" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="duration">Duration (Hours)</label>
                        <input type="number" id="duration" name="duration" min="1" max="24" step="0.5" placeholder="e.g., 2.5" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location / Platform</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Lab 4 & 3 or Codeforces" required>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="description">Contest Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="Briefly describe the rules, eligibility, and topics covered..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="status">Initial Status</label>
                    <select id="status" name="status">
                        <option value="upcoming">Upcoming</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="window.location.href='admin.php'">Cancel</button>
                    <button type="submit" class="btn-primary">Publish Contest</button>
                </div>

            </form>
        </main>
    </div>
</body>
</html>
