<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Contest | SGIPC Admin</title>
    <link rel="stylesheet" href="create-contest.css">
    <style>
        /* Shared styling for the inline status notification box */
        .alert-success {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <header class="page-header">
            <a href="admin.php" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Dashboard
            </a>
            <h1>Create New Contest</h1>
            <p class="subtitle">Set up a new competitive programming round for the platform.</p>
        </header>

        <main class="form-card">
            <div id="successAlert" class="alert-success"></div>

            <form id="contestForm" class="contest-form">
                
                <div class="form-group full-width">
                    <label for="title">Contest Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g., SGIPC Intra-University Team Selection" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="contest_type">Contest Type</label>
                        <input type="text" id="contest_type" name="contest_type" placeholder="e.g., Team Selection / Individual" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Lab 4 & Lab 3, 7th Floor or Online" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="start_time">Start Date & Time</label>
                        <input type="datetime-local" id="start_time" name="start_time" required>
                    </div>
                    <div class="form-group">
                        <label for="end_time">End Date & Time</label>
                        <input type="datetime-local" id="end_time" name="end_time" required>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="platform_link">Platform / Scoreboard Link (Optional)</label>
                    <input type="url" id="platform_link" name="platform_link" placeholder="e.g., https://codeforces.com/contest/..." >
                </div>

                <div class="form-group full-width">
                    <label for="description">Contest Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="Briefly describe the rules, eligibility, and topics covered..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="status">Initial Status</label>
                    <select id="status" name="status">
                        <option value="upcoming">Upcoming</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="window.location.href='admin.php'">Cancel</button>
                    <button type="submit" class="btn-primary">Publish Contest</button>
                </div>

            </form>
        </main>
    </div>

    <script>
        document.getElementById('contestForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Intercept default full-page reload behavior

            const formData = new FormData(this);
            const alertBox = document.getElementById('successAlert');

            fetch('process_contest.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Inject and display dynamic confirmation notice
                    alertBox.textContent = data.message;
                    alertBox.style.display = 'block';
                    
                    // Flush form state to let the Admin post subsequent listings immediately
                    document.getElementById('contestForm').reset();
                    
                    // Scroll container back up to keep the message viewable
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert('Operational Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('AJAX Error:', error);
                alert('Connection timeout or parsing failure. Please try again.');
            });
        });
    </script>
</body>
</html>
