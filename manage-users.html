<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | SGIPC Admin</title>
    <link rel="stylesheet" href="manage-users.css">
</head>

<body>
    <div class="admin-container">
        <header class="page-header">
            <a href="admin.php" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Dashboard
            </a>
            <h1>Manage Users</h1>
            <p class="subtitle">View registered members, update roles, and manage account permissions.</p>
        </header>

        <main class="table-card">
            <div class="table-responsive">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Dept</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="8" class="loading-text">Loading registered students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('get-users.php')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = ''; // Clear out the loading indicator

                    if (data.error) {
                        tbody.innerHTML = `<tr><td colspan="8" class="error-text">${data.error}</td></tr>`;
                        return;
                    }

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" class="loading-text">No registered users found.</td></tr>`;
                        return;
                    }

                    // Loop through data rows and build the table elements dynamically
                    data.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td class="user-name">${user.first_name} ${user.last_name}</td>
                            <td>${user.roll_number}</td>
                            <td class="text-uppercase">${user.department}</td>
                            <td>${user.email}</td>
                            <td>${user.phone}</td>
                            <td>
                       <select class="role-dropdown" onchange="updateRole(${user.id}, this.value)">
                            <option value="student" ${user.role === 'student' ? 'selected' : ''}>Student</option>
                            <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            <option value="President" ${user.role === 'President' ? 'selected' : ''}>President</option>
                            <option value="VP" ${user.role === 'VP' ? 'selected' : ''}>VP</option>
                            <option value="GS" ${user.role === 'GS' ? 'selected' : ''}>GS</option>
                            <option value="Treasurer" ${user.role === 'Treasurer' ? 'selected' : ''}>Treasurer</option>
                        </select>
                            </td>
                            <td>
                                <button class="btn-action btn-delete" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    document.getElementById('userTableBody').innerHTML =
                        `<tr><td colspan="8" class="error-text">Failed to fetch system resources.</td></tr>`;
                });
        });

        function updateRole(userId, newRole) {
            fetch('update-user-role.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: userId, role: newRole })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        console.log(`User ${userId} successfully updated to ${newRole}`);
                    } else {
                        alert('Failed to update role: ' + data.error);
                    }
                })
                .catch(err => {
                    alert('Network error occurred while updating role.');
                });
        }

        function deleteUser(userId) {
            if (confirm(`Are you sure you want to remove user ID ${userId}?`)) {
                // You can point this to a delete endpoint later if needed!
                console.log('Deleting user:', userId);
            }
        }
    </script>
</body>

</html>
